  <body>
    <!--
      THESIS: A wardrobe you operate with your thumb while getting dressed. It
      refuses the web-app dashboard: no burger drawer, no gradient chrome, no
      cards-of-icon-and-text. The clothes are the only colour on screen.
      OWN-WORLD: iOS system surfaces — grouped inset lists, a five-section tab
      bar, sheets, collapsing large titles, system neutrals in equal light and
      dark, one spruce tint for interaction, authored single-weight SVG icons.
      STORY: the visitor sees their own garments as catalog cutouts, stacks them
      into a look, and plans it onto a day.
      FIRST VIEWPORT: large title over a dropzone that states the trade in one
      line; the primary action sits directly under it, thumb-height.
      FORM: platform canon (Apple's own apps as the craft bar), user-pinned —
      no concept roll; the standing exit taken deliberately.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
